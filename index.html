
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو كافيه الكورنيش</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cafe-black': '#050505',
                        'cafe-dark': '#111111',
                        'cafe-gold': '#FADB5F', 
                        'cafe-gold-dark': '#d4b73e',
                    },
                    fontFamily: {
                        title: ['"Aref Ruqaa"', 'serif'],
                        body: ['"Cairo"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #08080a;
            color: #ffffff;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #151515 0%, #050505 80%);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #08080a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #FADB5F 0%, #d4b73e 100%); border-radius: 9999px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .dotted-leader {
            flex-grow: 1;
            border-bottom: 2px dotted rgba(255, 255, 255, 0.2);
            margin: 0 12px;
            position: relative;
            top: -4px;
            transition: all 0.3s ease;
        }

        .price-val { color: #FADB5F; font-weight: 800; font-size: 1.1rem; white-space: nowrap; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .item-name { font-weight: 700; font-size: 1.05rem; color: #f1f1f1; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        /* نبض العنوان */
        @keyframes floatGlowPulse {
            0%, 100% { text-shadow: 0 0 12px rgba(250, 219, 95, 0.5); transform: translateY(0) scale(1); }
            50% { text-shadow: 0 0 25px rgba(250, 219, 95, 1), 0 0 45px #FADB5F; transform: translateY(-8px) scale(1.03); }
        }
        .title-animated { display: inline-block; animation: floatGlowPulse 2.8s ease-in-out infinite; }

        /* إعدادات الكروت الأساسية */
        .menu-card { 
            position: relative; 
            border-radius: 1.25rem; 
            z-index: 1; 
            margin-bottom: 2.5rem; 
            transition: all 0.5s ease; 
        }

        .card-inner { 
            background: #111; 
            border-radius: 1.25rem; 
            overflow: hidden; 
            height: 100%; 
            position: relative; 
            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .card-inner:hover {
            border-color: rgba(250, 219, 95, 0.3);
        }

        /* الأكورديون (القوائم) */
        .accordion-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease; 
            opacity: 0; 
        }
        .accordion-content.open { 
            max-height: 3000px; 
            opacity: 1; 
            margin-top: 1rem; 
        }
        .accordion-icon { transition: transform 0.4s ease; }
        .accordion-header.open .accordion-icon { transform: rotate(180deg); }

        /* شريط التصفح */
        .nav-chip {
            white-space: nowrap; padding: 0.5rem 1.2rem; border-radius: 9999px;
            background: #1a1a1a; border: 1px solid #333;
            color: #ccc; font-weight: 700; transition: all 0.3s ease; cursor: pointer; font-size: 0.95rem;
        }
        .nav-chip.active, .nav-chip:hover { 
            background: #FADB5F; color: #000; border-color: #FADB5F; box-shadow: 0 4px 15px rgba(250, 219, 95, 0.3);
        }

        /* ----------------------------------------------------- */
        /* حركات السكرول (Animations on Scroll) للأقسام */
        /* ----------------------------------------------------- */
        .animate-card { opacity: 0; }

        /* 1. تأثير الصعود لأعلى */
        .anim-fade-up.visible { animation: fadeUpAnim 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes fadeUpAnim { 
            from { opacity: 0; transform: translateY(60px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* 2. تأثير التكبير */
        .anim-scale.visible { animation: scaleAnim 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes scaleAnim { 
            from { opacity: 0; transform: scale(0.9); } 
            to { opacity: 1; transform: scale(1); } 
        }

        /* 3. تأثير الانزلاق من اليمين */
        .anim-slide-right.visible { animation: slideRightAnim 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes slideRightAnim { 
            from { opacity: 0; transform: translateX(60px); } 
            to { opacity: 1; transform: translateX(0); } 
        }

        /* 4. تأثير القفز المرن */
        .anim-bounce.visible { animation: bounceAnim 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes bounceAnim { 
            0% { opacity: 0; transform: translateY(40px); } 
            60% { opacity: 1; transform: translateY(-15px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        /* 5. تأثير الدوران */
        .anim-twist.visible { animation: twistAnim 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes twistAnim { 
            from { opacity: 0; transform: rotate(-4deg) translateY(40px); } 
            to { opacity: 1; transform: rotate(0) translateY(0); } 
        }

        /* 6. تأثير الانبثاق */
        .anim-pop.visible { animation: popAnim 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popAnim { 
            0% { opacity: 0; transform: scale(0.8) translateY(20px); } 
            100% { opacity: 1; transform: scale(1) translateY(0); } 
        }

        /* ----------------------------------------------------- */
        /* حركات الأصناف الداخلية (تظهر بالتتابع عند فتح القسم) */
        /* ----------------------------------------------------- */
        .menu-item-row { 
            opacity: 0; 
            transform: translateY(20px); 
        }
        
        .accordion-content.open .menu-item-row {
            animation: itemFadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: var(--delay);
        }

        @keyframes itemFadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="font-body antialiased relative pb-24" id="main-body">

<!-- أزرار التواصل الاجتماعي -->
<div class="fixed bottom-6 right-6 z-[990] flex gap-3 px-4 py-2 rounded-full bg-cafe-black/80 backdrop-blur-md border border-gray-800 shadow-lg">
    <a href="https://wa.me/201282272242" target="_blank" class="bg-[#25D366] text-white w-10 h-10 flex items-center justify-center rounded-full text-lg shadow-lg hover:scale-110 transition-transform"><i class="fab fa-whatsapp"></i></a>
    <a href="https://www.facebook.com/share/19ES6UAYcN/" target="_blank" class="bg-[#1877F2] text-white w-10 h-10 flex items-center justify-center rounded-full text-lg shadow-lg hover:scale-110 transition-transform"><i class="fab fa-facebook-f"></i></a>

<!-- هيدر الموقع -->
<header class="relative pt-32 pb-24 flex flex-col items-center justify-center overflow-hidden">
    <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://cdn.phototourl.com/free/2026-06-14-6a988a66-859b-4e93-99ef-c47b09573c97.jpg');"></div>
    <div class="absolute inset-0 bg-black/80"></div>
    
    <!-- شكل ديكوري أنيق أعلى العنوان -->

<main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col mt-6 mb-12">
    
    <!-- شريط البحث السلس -->
    <div class="bg-[#121216]/90 backdrop-blur-md border border-white/5 rounded-2xl p-3 mb-6 shadow-xl flex items-center">
        <div class="relative w-full">
            <i class="fas fa-search absolute right-4 top-3.5 text-cafe-gold text-lg"></i>
            <input type="text" id="search-input" onkeyup="filterMenu()" placeholder="ابحث عن مشروبك أو تحليتك المفضلة..." class="w-full bg-[#1a1a1a] text-white border border-gray-700 rounded-xl pr-12 pl-4 py-3 focus:outline-none focus:border-cafe-gold transition-colors font-semibold placeholder-gray-500 shadow-inner">

    <!-- رسالة عدم وجود نتائج -->

        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center mx-auto">

        <button onclick="document.getElementById('search-input').value=''; filterMenu();" class="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-400 to-yellow-600 text-black font-extrabold text-sm shadow-lg hover:scale-105 transition-transform mt-2">عرض المنيو بالكامل</button>
    </div>

    <!-- شريط التصفح للأقسام (9 أقسام) -->
    <div class="sticky top-0 z-40 bg-[#08080a]/95 backdrop-blur-xl pt-4 pb-4 -mx-4 px-4 sm:mx-0 sm:px-0 border-b border-cafe-gold/20 mb-8" id="nav-chip-container">
        <div class="flex overflow-x-auto hide-scrollbar gap-2.5 pb-1 px-1 snap-x">
            <button onclick="scrollToSection('hot-drinks', this)" class="nav-chip active snap-start flex items-center gap-2"><i class="fas fa-mug-hot"></i> ساخن</button>
            <button onclick="scrollToSection('sahlab', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-mug-hot"></i> سحلب</button>
            <button onclick="scrollToSection('fresh-juices', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-glass-citrus"></i> عصائر</button>
            <button onclick="scrollToSection('soda', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-bottle-water"></i> صودا</button>
            <button onclick="scrollToSection('milkshake', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-blender"></i> شيك</button>
            <button onclick="scrollToSection('cocktails', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-martini-glass-citrus"></i> كوكتيلات</button>
            <button onclick="scrollToSection('ice-cream', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-ice-cream"></i> آيس كريم</button>
            <button onclick="scrollToSection('rice-pudding', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-bowl-rice"></i> حلو</button>
            <button onclick="scrollToSection('special-corner', this)" class="nav-chip snap-start flex items-center gap-2"><i class="fas fa-star"></i> مميز</button>

    <!-- حاوية المنيو الديناميكية -->
    <div id="menu-container"></div>

</main>

<footer class="text-center pb-8 pt-6 text-gray-500 font-bold border-t border-white/10 mx-4">
    <p class="text-cafe-gold mb-2 text-lg">كورنيش النيل - مفتوح 24 ساعة <i class="fas fa-clock text-amber-400 ml-1"></i></p>
    <p class="text-sm">© 2026 كافيه الكورنيش. جميع الحقوق محفوظة.</p>
</footer>

<script>
    // --- بيانات المنيو كاملة (9 أقسام مدمجة) ---
    const menuData = [
        {
            id: 'hot-drinks', title: 'المشروبات الساخنة', icon: 'fa-mug-hot', img: 'https://i.pinimg.com/736x/33/7e/c0/337ec0bb236800d4153acbf975ff6810.jpg',
            items: [['قهوة تركي', 20], ['قهوة فرنساوي', 25], ['قهوة بندق', 25], ['نسكافيه بلاك', 20], ['نسكافيه حليب', 25], ['اسبريسو', 25], ['أمريكانو', 20], ['كابتشينو', 30], ['لاتيه', 35], ['باور', 30], ['بريو سخن', 30], ['هوت شوكليت', 30], ['كاكاو', 25], ['كاكو حليب', 30], ['شاي', 10], ['شاي باكيت', 15], ['شاي حليب', 15], ['يانسون', 30], ['جنزبيل', 15], ['جنزبيل حليب', 20], ['قرفة', 15], ['قرفة حليب', 20], ['كركديه', 20], ['هوت سيدر', 25], ['ليمون (ساخن)', 10]]
        },
        {
            id: 'sahlab', title: 'السحلب', icon: 'fa-mug-hot', img: 'https://i.pinimg.com/736x/a4/7a/8d/a47a8d0248193210063e9da35480d16b.jpg',
            items: [['سحلب سادة', 25], ['سحلب مكسرات', 30], ['سحلب فواكه', 40]]
        },
        {
            id: 'fresh-juices', title: 'عصائر فريش', icon: 'fa-glass-citrus', img: 'https://i.pinimg.com/736x/9a/6a/fb/9a6afb2d0b80febb7ce9d744e1f0c6f3.jpg',
            items: [['موز', 25], ['بلح', 25], ['كيوي', 30], ['تفاح', 25], ['مانجا', 30], ['لمون ساقع', 20], ['جوافة', 25], ['بطيخ', 25], ['فراولة', 30], ['كنتالوب', 25], ['دوم حليب', 25], ['عصير كوكتيل', 30], ['فرابتشينو', 35], ['براوة (سوبيا وقشطة)', 25]]
        },
        {
            id: 'soda', title: 'الصودا', icon: 'fa-bottle-water', img: 'https://i.pinimg.com/736x/8e/c8/b6/8ec8b622d6d7135bc9c53e3065e5af08.jpg',
            items: [['كوكاكولا', 20], ['فانتا', 20], ['سفن اب', 20], ['ستينج', 20], ['بريل', 25], ['فيروز', 25], ['مياه صغيره', 10], ['مياه كبيره', 15]]
        },
        {
            id: 'milkshake', title: 'ميلك شيك', icon: 'fa-blender', img: 'https://i.pinimg.com/736x/28/b4/c1/28b4c1c8effe5d8d086b3288441e1a90.jpg',
            items: [['ميلك شيك فانيليا', 35], ['ميلك شيك مانجا', 40], ['ميلك شيك فراولة', 40], ['ميلك شيك لوتس', 40], ['أيس بوريو', 50]]
        },
        {
            id: 'cocktails', title: 'كوكتيلات', icon: 'fa-martini-glass-citrus', img: 'https://i.pinimg.com/736x/7f/a9/63/7fa9637a00bf54f1b48edf67ca5e78f0.jpg',
            items: [['كوكتيل الكورنيش', 60], ['قنبلة', 60], ['فروت سالاد (سلطة فواكه)', 50]]
        },
        {
            id: 'ice-cream', title: 'الآيس كريم والزبادي', icon: 'fa-ice-cream', img: 'https://i.pinimg.com/1200x/22/a7/d0/22a7d0ce7700f7169b5990609f5d458f.jpg',
            items: [['آيس كريم ميكس 4 بولة', 25], ['آيس كريم ميكس 5 بولة', 30], ['آيس كريم فواكه', 35], ['زبادي سادة', 30], ['زبادي مانجا', 35], ['زبادي فراولة', 35]]
        },
        {
            id: 'rice-pudding', title: 'أرز بلبن والحلو', icon: 'fa-bowl-rice', img: 'https://i.pinimg.com/736x/77/9e/63/779e63849edfa767274a125c1d6f21fd.jpg',
            items: [['أرز بلبن أوريو', 30], ['أرز بلبن مكسرات', 25], ['أرز بلبن بسبوسة', 30], ['طبق بسبوسة مكسرات', 25]]
        },
        {
            id: 'special-corner', title: 'الركن المميز', icon: 'fa-star', img: 'https://i.pinimg.com/736x/96/76/23/9676236929ace4bd2a860ba7a8c1e948.jpg',
            items: [['حمص الشام', 25], ['كنافة حليب بالقشطة', 35], ['طاجن أم علي بالقشطة', 50]]
        }
    ];

    // --- تعيين الأنيميشن لكل قسم (تأثيرات متنوعة) ---
    function getAnimationClass(id) {
        switch(id) {
            case 'hot-drinks': return 'anim-fade-up';
            case 'sahlab': return 'anim-scale';
            case 'fresh-juices': return 'anim-slide-right';
            case 'soda': return 'anim-bounce';
            case 'milkshake': return 'anim-twist';
            case 'cocktails': return 'anim-fade-up';
            case 'ice-cream': return 'anim-scale';
            case 'rice-pudding': return 'anim-slide-right';
            case 'special-corner': return 'anim-pop';
            default: return 'anim-fade-up';
        }
    }

    // --- نظام الـ Intersection Observer لظهور الأقسام بمرونة ---
    const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.15
    };

    const scrollObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, observerOptions);

    // --- نظام البحث والريندر الديناميكي ---
    function renderMenu(query = '') {
        const container = document.getElementById('menu-container');
        const noResults = document.getElementById('no-results');
        const navContainer = document.getElementById('nav-chip-container');
        let html = '';
        let foundAny = false;

        menuData.forEach(cat => {
            // فلترة العناصر
            const filteredItems = cat.items.filter(item => item[0].toLowerCase().includes(query));
            const catMatches = cat.title.toLowerCase().includes(query);
            
            if (filteredItems.length === 0 && !catMatches && query !== '') return;
            
            foundAny = true;
            const itemsToRender = query && !catMatches ? filteredItems : cat.items;
            
            // جعل القسم مفتوحاً وتلقائياً إذا كان هناك بحث نشط
            const isOpen = query !== '' ? 'open border-cafe-gold' : 'border-white/10';
            const contentOpen = query !== '' ? 'open' : '';
            const animClass = getAnimationClass(cat.id);

            html += `
            <section class="menu-card animate-card ${animClass}" id="${cat.id}" style="scroll-margin-top: 160px;">
                <div class="card-inner flex flex-col">
                    <div class="relative w-full h-48 sm:h-64 overflow-hidden">
                        <img src="${cat.img}" loading="lazy" class="absolute inset-0 w-full h-full object-cover object-center transform hover:scale-105 transition-transform duration-700">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111] via-[#111]/60 to-transparent"></div>
                    </div>
                    
                    <div class="p-4 sm:p-6 pt-0 relative z-10 -mt-10">
                        <!-- عنوان الأكورديون -->
                        <div class="accordion-header bg-[#16161b]/95 backdrop-blur-md border border-white/10 ${isOpen} rounded-xl px-5 py-4 flex items-center justify-between cursor-pointer shadow-xl transition-colors hover:border-amber-400/50" onclick="toggleAccordion(this)">
                            <div class="flex items-center gap-3">
                                <div class="bg-gradient-to-br from-amber-400 to-amber-600 text-black w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-lg">
                                    <i class="fas ${cat.icon}"></i>
                                </div>
                                <h2 class="text-2xl font-extrabold text-white tracking-wide">${cat.title}</h2>
                            </div>
                            <div class="bg-black/50 w-8 h-8 rounded-full flex items-center justify-center border border-white/10">
                                <i class="fas fa-chevron-down text-cafe-gold text-lg accordion-icon"></i>
                            </div>
                        </div>
                        
                        <!-- محتوى الأكورديون (الأصناف) -->
                        <div class="accordion-content ${contentOpen}">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-3 mt-5 px-2">
                                ${itemsToRender.map((item, idx) => `
                                    <div class="menu-item-row flex items-center justify-between py-2 group hover:bg-white/5 rounded-lg px-3 transition-colors border border-transparent hover:border-white/5" style="--delay: ${idx * 0.05}s">
                                        <span class="item-name group-hover:text-amber-300 transition-colors">${item[0]}</span>
                                        <div class="dotted-leader group-hover:border-amber-400/30"></div>
                                        <span class="price-val drop-shadow-md">${item[1]} ج</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </section>`;
        });

        if (!foundAny) {
            noResults.classList.remove('hidden');
            navContainer.classList.add('hidden');
        } else {
            noResults.classList.add('hidden');
            navContainer.classList.remove('hidden');
        }

        container.innerHTML = html;

        // تفعيل المراقبة لجميع الأقسام بعد الريندر
        document.querySelectorAll('.animate-card').forEach(card => {
            scrollObserver.observe(card);
        });
    }

    function filterMenu() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        renderMenu(query);
    }

    // --- الأكورديون والتمرير ---
    window.toggleAccordion = function(headerElement) {
        const content = headerElement.nextElementSibling;
        const isOpen = headerElement.classList.contains('open');
        
        if (!isOpen) { 
            headerElement.classList.add('open', 'border-cafe-gold'); 
            headerElement.classList.remove('border-white/10');
            content.classList.add('open'); 
        } else {
            headerElement.classList.remove('open', 'border-cafe-gold'); 
            headerElement.classList.add('border-white/10');
            content.classList.remove('open'); 
        }
    }

    window.scrollToSection = function(id, btnElement) {
        const section = document.getElementById(id);
        if (section) {
            document.querySelectorAll('.nav-chip').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            const header = section.querySelector('.accordion-header');
            if (!header.classList.contains('open')) { toggleAccordion(header); }
            
            section.scrollIntoView({ behavior: 'smooth' });
        }
    }

    // التشغيل الأولي
    document.addEventListener("DOMContentLoaded", () => {
        renderMenu();
    });
</script>

</body>
</html>
