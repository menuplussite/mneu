            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) { }
    }

    // الدخول من شاشة الترحيب
    function enterMenu(mode) {
        playClick();
        
        const splash = document.getElementById('splash-screen');
        const bgMusic = document.getElementById('bg-music');
        
        // تشغيل الموسيقى
        bgMusic.volume = 0.5;
        let playPromise = bgMusic.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => console.log("المتصفح منع التشغيل التلقائي للصوت"));
        }
        
        splash.style.opacity = '0';
        document.body.classList.remove('no-scroll');
        
        setTimeout(() => {
            splash.style.display = 'none';
            switchMenu(mode); // تفعيل المنيو المختار
        }, 500);
    }

    // التبديل بين الكافيه والمطعم
    function switchMenu(mode) {
        currentMode = mode;
        playClick();

        // تحديث مظهر التابات
        const tabCafe = document.getElementById('tab-cafe');
        const tabRest = document.getElementById('tab-restaurant');
        
        if (mode === 'cafe') {
            tabCafe.className = 'main-tab active flex-1 py-3 rounded-xl font-bold text-lg flex justify-center items-center gap-2';
            tabRest.className = 'main-tab inactive flex-1 py-3 rounded-xl font-bold text-lg flex justify-center items-center gap-2';
            document.getElementById('main-title').innerHTML = 'كافيه<br>الكورنيش';
        } else {
            tabRest.className = 'main-tab active flex-1 py-3 rounded-xl font-bold text-lg flex justify-center items-center gap-2';
            tabCafe.className = 'main-tab inactive flex-1 py-3 rounded-xl font-bold text-lg flex justify-center items-center gap-2';
            document.getElementById('main-title').innerHTML = 'مطعم<br>الكورنيش';
        }

        document.getElementById('search-input').value = '';
        renderNavChips();
        renderMenu();
    }

    // بناء أزرار التنقل العلوية
    function renderNavChips() {
        const container = document.getElementById('nav-chips');
        const data = currentMode === 'cafe' ? cafeData : restaurantData;
        let html = '';
        
        data.forEach((cat, index) => {
            const isActive = index === 0 ? 'active' : '';
            let shortTitle = cat.title.replace('قسم ', '').replace('طاسة الجريل والطلبات الفردية', 'طاسات');
            
            html += `<button onclick="scrollToSection('${cat.id}', this)" class="nav-chip snap-start flex items-center gap-1.5 ${isActive}"><i class="fas ${cat.icon}"></i> ${shortTitle}</button>`;
        });
        
        container.innerHTML = html;
        document.getElementById('nav-chip-container').scrollLeft = document.body.dir === 'rtl' ? 1000 : 0;
    }

    // بناء قائمة الأصناف
    const observerOptions = { root: null, rootMargin: '50px', threshold: 0.1 };
    const scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                scrollObserver.unobserve(entry.target); 
            }
        });
    }, observerOptions);

    function renderMenu(query = '') {
        const container = document.getElementById('menu-container');
        const noResults = document.getElementById('no-results');
        const navContainer = document.getElementById('nav-chip-container');
        
        const data = currentMode === 'cafe' ? cafeData : restaurantData;
        
        let html = '';
        let foundAny = false;

        data.forEach(cat => {
            const filteredItems = cat.items.filter(item => item[0].toLowerCase().includes(query));
            const catMatches = cat.title.toLowerCase().includes(query);
            
            if (filteredItems.length === 0 && !catMatches && query !== '') return;
            
            foundAny = true;
            const itemsToRender = query && !catMatches ? filteredItems : cat.items;
            const isOpen = query !== '' ? 'open border-cafe-gold' : 'border-white/5';
            const contentOpen = query !== '' ? 'open' : '';
            
            // إضافة ملاحظة القسم إذا وجدت
            const noteHtml = cat.note ? `<div class="bg-amber-900/40 border border-amber-500/30 text-amber-200 text-sm px-3 py-2 rounded-lg mb-3 text-center"><i class="fas fa-info-circle mr-1"></i> ${cat.note}</div>` : '';

            html += `
            <section class="menu-card animate-card" id="${cat.id}" style="scroll-margin-top: 200px;">
                <div class="card-inner flex flex-col">
                    <div class="relative w-full h-40 sm:h-56 overflow-hidden">
                        <img src="${cat.img}" loading="lazy" class="absolute inset-0 w-full h-full object-cover object-center">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111] via-[#111]/70 to-transparent"></div>
                    </div>
                    
                    <div class="p-4 relative z-10 -mt-8">
                        <div class="accordion-header bg-[#16161b] border border-white/5 ${isOpen} rounded-xl px-4 py-3 flex items-center justify-between cursor-pointer transition-colors" onclick="toggleAccordion(this)">
                            <div class="flex items-center gap-3">
                                <div class="bg-gradient-to-br from-amber-400 to-amber-600 text-black w-9 h-9 rounded-lg flex items-center justify-center text-md shadow-md">
                                    <i class="fas ${cat.icon}"></i>
                                </div>
                                <h2 class="text-xl font-bold font-title text-white tracking-wide">${cat.title}</h2>
                            </div>
                            <div class="w-7 h-7 rounded-full flex items-center justify-center bg-white/5">
                                <i class="fas fa-chevron-down text-cafe-gold text-sm accordion-icon"></i>
                            </div>
                        </div>
                        
                        <div class="accordion-content ${contentOpen}">
                            <div class="mt-4 px-1">
                                ${noteHtml}
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
                                    ${itemsToRender.map((item) => {
                                        let itemName = item[0];
                                        let itemDesc = '';
                                        if(itemName.includes('(') && itemName.includes(')')) {
                                            const parts = itemName.split('(');
                                            itemName = parts[0].trim();
                                            itemDesc = parts[1].replace(')', '').trim();
                                        }

                                        return `
                                        <div class="flex items-start justify-between py-2 px-2 hover:bg-white/5 rounded-md transition-colors w-full">
                                            <div class="flex flex-col flex-1 pr-2">
                                                <span class="item-name text-cafe-gold">${itemName}</span>
                                                ${itemDesc ? `<span class="item-desc">${itemDesc}</span>` : ''}
                                            </div>
                                            
                                            ${item[1] !== '-' ? `
                                            <div class="dotted-leader hidden sm:block mt-3"></div>
                                            <span class="price-val mt-1 ${item[1].toString().length > 6 ? 'text-sm' : ''}">${item[1]} ج</span>
                                            ` : ''}
                                        </div>
                                    `}).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>`;
        });

        if (!foundAny) {
            noResults.classList.remove('hidden');
            navContainer.classList.add('hidden');
        } else {
            noResults.classList.add('hidden');
            navContainer.classList.remove('hidden');
        }

        container.innerHTML = html;
        document.querySelectorAll('.animate-card').forEach(card => scrollObserver.observe(card));
    }

    function debounceFilterMenu() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            filterMenu();
        }, 200); 
    }

    function filterMenu() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        renderMenu(query);
    }

    window.toggleAccordion = function(headerElement) {
        playClick();
        const content = headerElement.nextElementSibling;
        const isOpen = headerElement.classList.contains('open');
        
        if (!isOpen) { 
            headerElement.classList.add('open', 'border-cafe-gold'); 
            headerElement.classList.remove('border-white/5');
            content.classList.add('open'); 
        } else {
            headerElement.classList.remove('open', 'border-cafe-gold'); 
            headerElement.classList.add('border-white/5');
            content.classList.remove('open'); 
        }
    }

    window.scrollToSection = function(id, btnElement) {
        playClick();
        const section = document.getElementById(id);
        if (section) {
            document.querySelectorAll('.nav-chip').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            const header = section.querySelector('.accordion-header');
            if (!header.classList.contains('open')) { 
                header.classList.add('open', 'border-cafe-gold'); 
                header.classList.remove('border-white/5');
                header.nextElementSibling.classList.add('open'); 
            }
            
            const yOffset = -180; 
            const y = section.getBoundingClientRect().top + window.pageYOffset + yOffset;
            window.scrollTo({top: y, behavior: 'smooth'});
        }
    }
</script>
