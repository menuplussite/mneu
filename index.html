    <script>
        tailwind.config = {

    <style>
        /* تحسينات الأداء والسرعة */
        body {
            background-color: #08080a;
            color: #ffffff;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #151515 0%, #050505 80%);
            -webkit-font-smoothing: antialiased;
        }

        .no-scroll { overflow: hidden; height: 100vh; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #08080a; }
        ::-webkit-scrollbar-thumb { background: #FADB5F; border-radius: 10px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .dotted-leader {
            flex-grow: 1;
            border-bottom: 2px dotted rgba(255, 255, 255, 0.15);
            margin: 0 12px;
            position: relative;
            top: -4px;
        }

        .price-val { color: #FADB5F; font-weight: 800; font-size: 1.1rem; white-space: nowrap; }
        .item-name { font-weight: 700; font-size: 1.1rem; color: #f1f1f1; }

        /* نبض خفيف للعنوان */
        @keyframes floatPulse {
            0%, 100% { transform: translateY(0); opacity: 0.95; text-shadow: 0 0 10px rgba(250,219,95,0.4); }
            50% { transform: translateY(-5px); opacity: 1; text-shadow: 0 0 20px rgba(250,219,95,0.8); }
        }
        .title-animated { display: inline-block; animation: floatPulse 3s ease-in-out infinite; will-change: transform, opacity, text-shadow; }

        /* إضاءة نابضة لزر الدخول */
        @keyframes btnPulseFast {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(250,219,95,0.4), 0 0 25px rgba(250,219,95,0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(250,219,95,0.7), 0 0 45px rgba(250,219,95,0.4); }
        }
        .btn-enter-animated {
            animation: btnPulseFast 1.5s infinite;
            will-change: transform, box-shadow;
        }

        /* كارت المنيو مع إضاءة خفيفة وسريعة */
        .menu-card { 
            position: relative; 
            border-radius: 1.25rem; 
            z-index: 1; 
            margin-bottom: 2rem; 
            padding: 1.5px;
            overflow: hidden; 
            transform: translateZ(0);
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; 
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 75%, #FADB5F 90%, #ffffff 100%);
            animation: rotateLED 5s linear infinite;
            z-index: 0;
            will-change: transform;
        }

        @keyframes rotateLED { 100% { transform: rotate(360deg); } }

        .card-inner { 
            background: #111; 
            border-radius: 1.2rem; 
            overflow: hidden; 
            height: 100%; 
            position: relative; 
            z-index: 2; 
        }

        .accordion-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.4s ease-out, opacity 0.3s ease; 
            opacity: 0; 
        }
        .accordion-content.open { 
            max-height: 2500px; 
            opacity: 1; 
            margin-top: 1rem; 
        }
        .accordion-icon { transition: transform 0.3s ease; }
        .accordion-header.open .accordion-icon { transform: rotate(180deg); }

        .nav-chip {
            white-space: nowrap; padding: 0.5rem 1.2rem; border-radius: 9999px;
            background: #1a1a1a; border: 1px solid #333;
            color: #ccc; font-weight: 700; transition: background 0.2s, color 0.2s; cursor: pointer; font-size: 1rem;
        }
        .nav-chip.active { background: #FADB5F; color: #000; border-color: #FADB5F; }

        /* حركات ظهور خفيفة */
        .animate-card { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .animate-card.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>

        setTimeout(() => {
            const rightCurtain = document.getElementById('curtain-right');
            const leftCurtain = document.getElementById('curtain-left');
            const curtainContainer = document.getElementById('curtain-container');
            
            if(rightCurtain) rightCurtain.style.transform = 'translateX(100vw)';
            if(leftCurtain) leftCurtain.style.transform = 'translateX(-100vw)';

            }, 1600);
            
        }, 1100);

    let audioCtx;
    function playClick() {
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) {
            console.log("Audio API غير مدعوم في هذا المتصفح");
        }
    }

    const observerOptions = { root: null, rootMargin: '50px', threshold: 0.1 };
    const scrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                scrollObserver.unobserve(entry.target); 
            }
        });
    }, observerOptions);

    function renderMenu(query = '') {
        const container = document.getElementById('menu-container');
        const noResults = document.getElementById('no-results');
        const navContainer = document.getElementById('nav-chip-container');
        let html = '';
        let foundAny = false;

        menuData.forEach(cat => {
            const filteredItems = cat.items.filter(item => item[0].toLowerCase().includes(query));
            const catMatches = cat.title.toLowerCase().includes(query);
            
            if (filteredItems.length === 0 && !catMatches && query !== '') return;
            
            foundAny = true;
            const itemsToRender = query && !catMatches ? filteredItems : cat.items;
            const isOpen = query !== '' ? 'open border-cafe-gold' : 'border-white/5';
            const contentOpen = query !== '' ? 'open' : '';

            html += `
            <section class="menu-card animate-card" id="${cat.id}" style="scroll-margin-top: 140px;">
                <div class="card-inner flex flex-col">
                    <div class="relative w-full h-40 sm:h-56 overflow-hidden">
                        <img src="${cat.img}" loading="lazy" class="absolute inset-0 w-full h-full object-cover object-center">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#111] via-[#111]/70 to-transparent"></div>
                    </div>
                    
                    <div class="p-4 relative z-10 -mt-8">
                        <div class="accordion-header bg-[#16161b] border border-white/5 ${isOpen} rounded-xl px-4 py-3 flex items-center justify-between cursor-pointer transition-colors" onclick="toggleAccordion(this)">
                            <div class="flex items-center gap-3">
                                <div class="bg-gradient-to-br from-amber-400 to-amber-600 text-black w-9 h-9 rounded-lg flex items-center justify-center text-md shadow-md">
                                    <i class="fas ${cat.icon}"></i>
                                </div>
                                <h2 class="text-xl font-bold font-title text-white tracking-wide">${cat.title}</h2>
                            </div>
                            <div class="w-7 h-7 rounded-full flex items-center justify-center bg-white/5">
                                <i class="fas fa-chevron-down text-cafe-gold text-sm accordion-icon"></i>
                            </div>
                        </div>
                        
                        <div class="accordion-content ${contentOpen}">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 mt-4 px-1">
                                ${itemsToRender.map((item) => `
                                    <div class="flex items-center justify-between py-1.5 px-2 hover:bg-white/5 rounded-md transition-colors">
                                        <span class="item-name">${item[0]}</span>
                                        <div class="dotted-leader"></div>
                                        <span class="price-val">${item[1]} ج</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            </section>`;
        });

        if (!foundAny) {
            noResults.classList.remove('hidden');
            navContainer.classList.add('hidden');
        } else {
            noResults.classList.add('hidden');
            navContainer.classList.remove('hidden');
        }

        container.innerHTML = html;
        document.querySelectorAll('.animate-card').forEach(card => scrollObserver.observe(card));
    }

    function filterMenu() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        renderMenu(query);
    }

    window.toggleAccordion = function(headerElement) {
        playClick();
        const content = headerElement.nextElementSibling;
        const isOpen = headerElement.classList.contains('open');
        
        if (!isOpen) { 
            headerElement.classList.add('open', 'border-cafe-gold'); 
            headerElement.classList.remove('border-white/5');
            content.classList.add('open'); 
        } else {
            headerElement.classList.remove('open', 'border-cafe-gold'); 
            headerElement.classList.add('border-white/5');
            content.classList.remove('open'); 
        }
    }

    window.scrollToSection = function(id, btnElement) {
        playClick();
        const section = document.getElementById(id);
        if (section) {
            document.querySelectorAll('.nav-chip').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            const header = section.querySelector('.accordion-header');
            if (!header.classList.contains('open')) { 
                header.classList.add('open', 'border-cafe-gold'); 
                header.classList.remove('border-white/5');
                header.nextElementSibling.classList.add('open'); 
            }
            
            section.scrollIntoView({ behavior: 'smooth' });
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderMenu();
    });
</script>

</body>
</html>
